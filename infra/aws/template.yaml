AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ResolveQA Ephemeral Demo Backend Infrastructure (Single-Process EC2 + CloudFront HTTPS).
  Packages the Python 3.11 stdlib Intake & Simulated Chat HTTP surface as an intermediate
  demo runtime. Deploys code from a verified S3 bundle with SHA256 integrity check.
  Restricts origin access at both network (CloudFront Prefix List) and application
  (X-ResolveQA-Origin-Verify) layers. Ephemeral in-memory storage only (resets on restart).
  Full hackathon agent pipeline (reproduction, automated fix, PR generation) is not included.

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
    Description: Environment name tag (e.g. demo, hackathon, staging)

  InstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues:
      - t4g.nano
      - t4g.micro
    Description: "Graviton ARM64 EC2 instance type (t4g.nano: 2 vCPU, 0.5 GB RAM; t4g.micro: 2 vCPU, 1 GB RAM)"

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM Parameter path for latest Amazon Linux 2023 ARM64 AMI

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for EC2 instance placement (default VPC is supported)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet ID in which the EC2 backend instance will reside

  ArtifactBucket:
    Type: String
    Description: S3 bucket containing the versioned resolveqa-bundle.tar.gz artifact

  ArtifactKey:
    Type: String
    Description: S3 object key for the versioned resolveqa-bundle.tar.gz artifact

  ArtifactSha256:
    Type: String
    AllowedPattern: ^[a-fA-F0-9]{64}$
    Description: SHA256 hash of the artifact bundle to verify integrity during instance bootstrap

  OriginSecretHeader:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: ^[a-fA-F0-9]{32,128}$
    ConstraintDescription: OriginSecretHeader must be a hexadecimal string between 32 and 128 characters.
    Description: Secret token injected by CloudFront (X-ResolveQA-Origin-Verify) and validated by backend handler

  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: AWS-managed Prefix List ID for CloudFront origin-facing IPs in us-east-1 (pl-3b927c52)

  CorsOrigins:
    Type: String
    Default: >-
      http://localhost:3000,http://127.0.0.1:3000,https://dsh3ja1i4695p.cloudfront.net,https://d10ry6ff7l79jo.cloudfront.net
    Description: Comma-separated browser Origins allowed by RESOLVEQA_CORS_ORIGINS (Mola Quadro/Admin)

Resources:
  BackendInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: S3ArtifactReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}/${ArtifactKey}
      Tags:
        - Key: Project
          Value: ResolveQA
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref BackendInstanceRole

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ResolveQA Backend restricting port 8080 to CloudFront origin IPs
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: Allow HTTP traffic on port 8080 exclusively from CloudFront origin-facing IPs
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic for package updates and S3 artifact download
      Tags:
        - Key: Name
          Value: !Sub resolveqa-backend-sg-${EnvironmentName}
        - Key: Project
          Value: ResolveQA
        - Key: EphemeralDemo
          Value: "true"

  BackendInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT5M
        Count: 1
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref BackendInstanceProfile
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub resolveqa-backend-${EnvironmentName}
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ResolveQA
        - Key: Runtime
          Value: python3.11-ephemeral-single-process
        - Key: HackathonScope
          Value: intermediate-intake-chat-only
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euo pipefail

            CFN_SIGNAL_BIN="/usr/bin/cfn-signal"
            [ -x "$CFN_SIGNAL_BIN" ] || CFN_SIGNAL_BIN="/opt/aws/bin/cfn-signal"

            trap 'catch_error $? $LINENO' ERR
            catch_error() {
              local exit_code="$1"
              local line_no="$2"
              echo "[ERROR] Bootstrap failed at line $line_no with exit code $exit_code" >&2
              if command -v cfn-signal >/dev/null 2>&1; then
                cfn-signal -e 1 --stack "${AWS::StackName}" --resource BackendInstance --region "${AWS::Region}" || true
              elif [ -x "$CFN_SIGNAL_BIN" ]; then
                "$CFN_SIGNAL_BIN" -e 1 --stack "${AWS::StackName}" --resource BackendInstance --region "${AWS::Region}" || true
              fi
              exit "$exit_code"
            }

            exec > >(tee /var/log/resolveqa-userdata.log|logger -t resolveqa-userdata -s 2>/dev/console) 2>&1
            echo "[ResolveQA] Bootstrapping ResolveQA ${EnvironmentName} backend (artifact ${ArtifactSha256})..."

            dnf update -y
            dnf install -y python3.11 aws-cfn-bootstrap tar gzip

            # Ensure application directory exists
            mkdir -p /opt/resolveqa

            # Download versioned artifact bundle from private S3 bucket using instance profile
            echo "[ResolveQA] Downloading deployment artifact from s3://${ArtifactBucket}/${ArtifactKey}..."
            aws s3 cp "s3://${ArtifactBucket}/${ArtifactKey}" /tmp/resolveqa-bundle.tar.gz --region "${AWS::Region}"

            # Verify bundle SHA256 integrity before extraction
            echo "[ResolveQA] Verifying artifact SHA256 checksum..."
            echo "${ArtifactSha256}  /tmp/resolveqa-bundle.tar.gz" | sha256sum -c -

            # Extract bundle into /opt/resolveqa
            tar -xzf /tmp/resolveqa-bundle.tar.gz -C /opt/resolveqa
            rm -f /tmp/resolveqa-bundle.tar.gz

            # Create non-privileged user and set ownership
            useradd -r -s /sbin/nologin resolveqa || true
            chown -R resolveqa:resolveqa /opt/resolveqa

            # Create root-owned private environment file (mode 600) to keep secret token off process args
            mkdir -p /etc/resolveqa
            cat << EOF > /etc/resolveqa/backend.env
            RESOLVEQA_HOST=0.0.0.0
            RESOLVEQA_PORT=8080
            RESOLVEQA_ORIGIN_SECRET=${OriginSecretHeader}
            RESOLVEQA_ROOT=/opt/resolveqa
            RESOLVEQA_ENVIRONMENT=${EnvironmentName}
            RESOLVEQA_CASE_STORE=file
            RESOLVEQA_QUEUE=file
            RESOLVEQA_ALLOW_OPERATOR_ADVANCE=0
            RESOLVEQA_AGENT_MODE=general
            RESOLVEQA_CORS_ORIGINS=${CorsOrigins}
            PYTHONDONTWRITEBYTECODE=1
            PYTHONUNBUFFERED=1
            PYTHONPATH=/opt/resolveqa/src
            EOF
            chmod 600 /etc/resolveqa/backend.env
            chown root:root /etc/resolveqa/backend.env
            mkdir -p /opt/resolveqa/runs
            chown -R resolveqa:resolveqa /opt/resolveqa/runs

            # Create systemd unit referencing EnvironmentFile without token in ExecStart args
            cat << 'EOF' > /etc/systemd/system/resolveqa-backend.service
            [Unit]
            Description=ResolveQA Backend API (intake + snapshot/SSE)
            Documentation=https://github.com/moouraajv/ResolveQA
            After=network.target

            [Service]
            Type=simple
            User=resolveqa
            Group=resolveqa
            WorkingDirectory=/opt/resolveqa
            EnvironmentFile=/etc/resolveqa/backend.env
            ExecStart=/usr/bin/python3.11 scripts/run_server.py --host 0.0.0.0 --port 8080
            Restart=on-failure
            RestartSec=5
            LimitNOFILE=65536

            [Install]
            WantedBy=multi-user.target
            EOF

            cat << 'EOF' > /etc/systemd/system/resolveqa-worker.service
            [Unit]
            Description=ResolveQA cloud agent worker
            Documentation=https://github.com/moouraajv/ResolveQA
            After=network.target resolveqa-backend.service

            [Service]
            Type=simple
            User=resolveqa
            Group=resolveqa
            WorkingDirectory=/opt/resolveqa
            EnvironmentFile=/etc/resolveqa/backend.env
            ExecStart=/usr/bin/python3.11 -m resolveqa.worker --store file --queue file --root /opt/resolveqa
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable resolveqa-backend resolveqa-worker
            systemctl start resolveqa-backend
            systemctl start resolveqa-worker

            # Poll localhost healthcheck to confirm readiness before signaling CloudFormation
            echo "[ResolveQA] Checking service readiness on localhost..."
            READY=0
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-ResolveQA-Origin-Verify: ${OriginSecretHeader}" http://127.0.0.1:8080/health || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                READY=1
                echo "[ResolveQA] Backend is ready and responding with HTTP 200."
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "[ERROR] Backend service failed to become ready within timeout." >&2
              exit 1
            fi

            # Signal CloudFormation that instance bootstrap is complete and healthy
            echo "[ResolveQA] Signaling CloudFormation success..."
            if command -v cfn-signal >/dev/null 2>&1; then
              cfn-signal -e 0 --stack "${AWS::StackName}" --resource BackendInstance --region "${AWS::Region}"
            elif [ -x "$CFN_SIGNAL_BIN" ]; then
              "$CFN_SIGNAL_BIN" -e 0 --stack "${AWS::StackName}" --resource BackendInstance --region "${AWS::Region}"
            fi

            echo "[ResolveQA] Bootstrap sequence finished successfully."

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "ResolveQA ${EnvironmentName} backend CDN (HTTPS)"
        Origins:
          - Id: ResolveQABackendOrigin
            DomainName: !GetAtt BackendInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 8080
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginKeepaliveTimeout: 30
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-ResolveQA-Origin-Verify
                HeaderValue: !Ref OriginSecretHeader
        DefaultCacheBehavior:
          TargetOriginId: ResolveQABackendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        HttpVersion: http2and3
        PriceClass: PriceClass_100
      Tags:
        - Key: Project
          Value: ResolveQA
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  CloudFrontDomainName:
    Description: CloudFront distribution domain name (HTTPS entry point)
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontBaseUrl:
    Description: Public HTTPS base URL for ResolveQA backend
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  HealthEndpoint:
    Description: Health check endpoint
    Value: !Sub https://${CloudFrontDistribution.DomainName}/health

  FormEndpoint:
    Description: Intake web form endpoint
    Value: !Sub https://${CloudFrontDistribution.DomainName}/form

  ChatEndpoint:
    Description: Simulated chat endpoint
    Value: !Sub https://${CloudFrontDistribution.DomainName}/chat

  InstancePublicIp:
    Description: Public IP address of backend EC2 instance
    Value: !GetAtt BackendInstance.PublicIp

  OriginProtectionStatus:
    Description: Multi-layer origin protection status
    Value: Enforced via CloudFront Managed Prefix List pl-3b927c52 at SG8080 and X-ResolveQA-Origin-Verify header validation at application layer.

  EphemeralStorageNotice:
    Description: Storage notice and hackathon scope limit
    Value: Storage is strictly ephemeral in-memory. State resets on reboot. Full agent reproduction/PR pipeline not included.
